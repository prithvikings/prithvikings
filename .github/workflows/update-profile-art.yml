name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/animated-terminal-profile

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workflow dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Fetch public contribution calendar
        env:
          GH_PROFILE_USER: prithvikings
        run: python scripts/fetch_contributions.py
      - name: Render heatmap and statistics
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
      - name: Commit refreshed artwork
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution artwork [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
